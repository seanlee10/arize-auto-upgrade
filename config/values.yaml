# values.yaml — 체크인되는 실제 설정 파일
#
# 비밀이 아닌 값은 여기에 그대로 둔다. 버전 관리로 diff 와 리뷰가 되는 것이
# 이 파일을 체크인하는 이유다.
#
# 달러-중괄호 자리표시자로 남은 것은 민감정보뿐이며 GitHub Environment Secrets 에서 주입된다:
#   ARIZE_HUB_JWT              ARIZE_CIPHER_KEY         ARIZE_POSTGRES_PASSWORD
#   ARIZE_SMTP_USER            ARIZE_SMTP_PASSWORD      ARIZE_GCP_SA_KEY
#   ARIZE_INTERNAL_TLS_CERT    ARIZE_INTERNAL_TLS_KEY
#   ARIZE_FLIGHT_TLS_CERT      ARIZE_FLIGHT_TLS_KEY
#
# 렌더링:  scripts/render-values.sh <출력경로>
# 절대 렌더 결과를 로그로 남기지 말 것 — 개인키가 들어 있다.
cloud: "aws"
clusterName: "arn:aws:eks:ap-northeast-2:173729215222:cluster/sean-cluster"
region: "ap-northeast-2"
hubJwt: "${ARIZE_HUB_JWT}"
gazetteBucket: "sean-cluster-gazette-bucket"
druidBucket: "sean-cluster-druid-bucket"

organizationName: "sean-test"
# legacyGlobalIdPrefix: "<stale example from a different cluster, kept for reference>"
cipherKey: "${ARIZE_CIPHER_KEY}"
clusterSizing: "test"
collectNodeMetrics: true
zoneAware: false

alyxEnabled: false

# The URL used to reach the Arize UI once ingress endpoints are created
appBaseUrl: "https://arize-app.iqhub.co"
expBaseUrl: "https://grpc.iqhub.co"

# AWS IAM role for pod-level bucket access
awsServiceAccountRoleRwBucket: "arn:aws:iam::173729215222:role/sean-cluster-webidentity-role-rw"

realTimeUseLatestOffset: false
realTimeMutableCutoverDate: 3000-01-01T00:00:00Z
realTimeGlobalCutoverTime: 3000-01-01T00:00:00Z
realTimeSpaceCutoverTime: 3000-01-01T00:00:00Z

multiCloudGcpServiceAccountKey: "${ARIZE_GCP_SA_KEY}"

# AWS Storage Classes
storageClassAwsStandard: "gp3"
storageClassAwsSsd: "gp3"

postgresPassword: "${ARIZE_POSTGRES_PASSWORD}"

smtpPassword: "${ARIZE_SMTP_PASSWORD}"
smtpUser: "${ARIZE_SMTP_USER}"
smtpHost: "email-smtp.ap-northeast-2.amazonaws.com"
smtpSenderEmail: "yihsean@gmail.com"
smtpPort: 587
smtpRequireTls: true

# 11.45.0 부터 blobOffloadEnabled 기본값이 true 로 바뀐다. 켜려면 druidBucket 의
# CORS 와 접근 권한을 먼저 구성해야 하고, 그 전에는 새 pre-check 가 업그레이드를
# 막는다. 이 클러스터는 지금까지 false 로 운영해 왔으므로 현행을 명시해 유지한다.
# 활성화하려면 버킷 구성을 먼저 마친 뒤 true 로 바꿀 것.
blobOffloadEnabled: false

dataFabricEnabled: true
dataFabricPermissionsCheckEnabled: true

internalEndpointsAppTlsCert: "${ARIZE_INTERNAL_TLS_CERT}"
internalEndpointsAppTlsKey: "${ARIZE_INTERNAL_TLS_KEY}"

flightTlsCert: "${ARIZE_FLIGHT_TLS_CERT}"
flightTlsKey: "${ARIZE_FLIGHT_TLS_KEY}"

# Only required if using a common node pool
historicalNodePoolEnabled: true

enableCustomCodeEvals: true

# GCP 프로젝트 설정
gcpProject: "anne-2f587"

# 3.2단계에서 생성한 credential-config.json을 base64 인코딩한 값

