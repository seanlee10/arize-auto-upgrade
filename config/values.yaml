# --- baseOverlay: druid-compaction 자원 (1200 rps 인입 조사 반영) ---
#
# [적용 순서] manifests/base/kustomization.yaml
#     62: patches      - overlays/sizing_test.yaml        <- 프로파일
#     80: patches      - overlays/customizations.yaml     <- 여기 (프로파일을 덮어씀)
#     82: transformers - transformers/customizations.yaml <- baseTransformer
#
# [namespace 는 대상 리소스를 따라간다 — 일괄 규칙이 아니다]
#   patch 의 namespace 유무가 base manifest 의 그것과 일치해야 kustomize 가 대상을
#   찾는다. 배포판 안에서 이게 리소스마다 다르다:
#     app-server.yaml       -> Deployment 에 namespace 없음  -> patch 에도 쓰지 말 것
#     druid-indexing.yaml   -> namespace: 'arize' 있음        -> patch 에도 써야 함
#   틀리면 install 이 이렇게 죽는다(run 33305166742):
#     no matches for Id Deployment.v1.apps/druid-compaction.[noNs]
#   [noNs] 는 kustomize 가 "네임스페이스 없는 것"을 찾았다는 뜻이다. 새 대상을 추가할
#   때는 /distributions/<ver>/manifests/base/ 에서 해당 리소스를 먼저 확인할 것.
#
# [범위] sizing_test 가 과소 설정한 /tmp 볼륨 두 개만 덮는다. 어느 문서도 노드
#   CPU/메모리 requests 를 늘리지 않으므로 클러스터 용량에 영향이 없다. Xmx 는
#   이미 있는 limits.memory 16Gi 안이고, /tmp 는 파드마다 별도 EBS 라 노드 자원과
#   무관하다.
#   근본적으로는 clusterSizing 프로파일이 문제다. sizing_test 는 druidloader 1Gi,
#   druid-compaction 5Gi, receiver 5Gi, gazette 20Gi 를 설정하는데 Arize 자체
#   prod 는 druidloader 에만 32~64Gi 를 쓴다. 개별 오버레이는 두더지잡기이므로
#   용량 계획을 세워 프로파일 상향을 별도로 판단할 것.
#
# [empty-tmp 5Gi -> 50Gi]
#   기본 5Gi 가 소진되어 55분간 ENOSPC 810건이 발생했고 색인이 정지했다.
#   목표 세그먼트 크기가 750MiB 이므로 5Gi 는 동시 작업 몇 개에 찬다.
#   같은 DruidIndexingService 를 쓰는 druid-indexing 은 50G 를 쓴다.
#
# [Xmx 3g -> 10g]
#   permits 는 힙의 선형 함수다(IndexResourceCalculator). 3g 에서 permits 9~12,
#   요청당 3개 소모라 동시 3~4건이 한계였고 "Maximum concurrent requests reached"
#   가 636건 발생했다. 10g 로 permits 60. limits.memory 16Gi 안이라 안전하다.
#
# [주의] limits.memory 를 줄이려면 Xmx 를 먼저 낮출 것. 힙이 컨테이너 한도를
#   넘으면 커널이 kill 한다.
#
# [druidloader /tmp 1Gi -> 50Gi]
#   druidloader 는 샤드별/데이터소스별 arrow 파일을 /tmp 에 버퍼링한 뒤 S3 에
#   올린다. sizing_test 의 1Gi 는 실부하에서 즉시 찬다. 2026-08-31 에 1200 rps 로
#   ENOSPC 가 발생해 tracing-records 샤드 8개가 전부 FAILED 로 떨어졌고 클러스터
#   전체 트레이스 입수가 멈췄다(저널 30GB 정체).
#     arrow/ipc: could not write magic Arrow bytes:
#       write /tmp/druidloader/tracing-records/shard_007-.../... : no space left on device
#     servePrimary failed err="...app.FinalizeTxn: Finalize called on empty builder"
#   쓰기 실패가 arrowWriter.Builder 를 nil 로 만드는데 AppendRow 에는 같은 파일의
#   Convert 와 달리 recover() 가 없어 SIGSEGV 로 샤드 고루틴이 죽는다. FAILED 샤드는
#   자동 복구되지 않는 반면 파드는 Running/Ready 로 남아 헬스체크에 걸리지 않는다.
#   즉 이 볼륨 증설은 방아쇠만 막는다. 증폭 경로는 코드 수정이 필요하다.
#   50Gi 는 on-prem 오버레이의 기본값이다. replicas 3 기준 gp3 150Gi 를 쓴다.
#
# [namespace 는 문서마다 다르다 — 위 규칙을 문서별로 적용할 것]
#   druid-compaction (druid-indexing.yaml)  -> namespace: 'arize' 있음 -> 쓴다
#   druidloader      (druidloader.yaml)     -> namespace 없음          -> 쓰지 않는다
baseOverlay: |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: druid-compaction
    namespace: arize
  spec:
    template:
      spec:
        volumes:
          - name: empty-tmp
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: gp3
                  volumeMode: Filesystem
                  resources:
                    requests:
                      storage: 50Gi
        containers:
          - name: druid-compaction
            env:
              - name: JAVA_TOOL_OPTIONS
                value: >-
                  -Ddruid.properties.file=/etc/druid/runtime.properties
                  -Xmx10g -Xms10g -XX:MaxDirectMemorySize=2g
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: druidloader
  spec:
    template:
      spec:
        volumes:
          - name: druidloader
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: gp3
                  volumeMode: Filesystem
                  resources:
                    requests:
                      storage: 50Gi

# --- baseTransformer ---
# receiver 의 --postgres_max_open_conns 를 추가한다.
#
# args 는 strategic merge patch 에서 merge key 가 없어 리스트 전체가 교체된다.
# receiver args 는 25개이고 그중 10개가 배포판이 렌더한 클러스터 고유값
# (버킷명, 리전, 시크릿 경로) 이므로 baseOverlay 에 넣으면 렌더 로직을 복제하게 되고
# 향후 릴리스에서 인자가 바뀌어도 이 목록이 덮어써 버린다.
# JSON6902 는 append 가 가능하므로 transformer 로 처리한다.
#
# [근거] 기본값 2 는 receiver 2 파드 기준 동시 커넥션 4개다. 인증/RBAC 쿼리가
#   요청마다 돌기 때문에 이 값이 인입 처리량의 상한이 된다(플래그 주석에 명시).
#   SaaS prod 는 2026-07-31 인입 장애 후 20 으로 올렸으나(overlays/prod/receiver.yaml)
#   온프렘 오버레이는 그 수정을 물려받지 못했다.
#   실측: 2 -> 20 으로 올리자 600 rps 의 p50 이 423ms -> 17.5ms 로 개선됐고,
#   되돌아간 뒤 인클러스터 1200 rps 가 337 rps 로 떨어졌다.
baseTransformer: |
  apiVersion: builtin
  kind: PatchTransformer
  metadata:
    name: receiver-postgres-max-open-conns
  target:
    group: apps
    version: v1
    kind: Deployment
    name: receiver
    namespace: arize
  patch: |-
    [{"op": "add",
      "path": "/spec/template/spec/containers/0/args/-",
      "value": "--postgres_max_open_conns=20"}]

# --- 인입 조사 반영: 코디네이터 태스크 슬롯 ---
# taskTracker / TaskCountPerDatasource 는 작업 종류를 구분하지 않는다
# (coordinator.go:946-949). 실패하는 컴팩션 재시도가 색인 슬롯을 잠식해
# atMaxTaskCapacity 가 55분간 48회 발생했다. 코드 기본값은 14 이며
# 배포값 5 는 그보다 낮아 잠식이 더 쉽게 일어난다.
druidImporterMaxTasksToRunPerDatasource: 14

# --- Private registry (added for the automated upgrade pipeline) ---
pushRegistry: "173729215222.dkr.ecr.ap-northeast-2.amazonaws.com"
repoName: "arize"
